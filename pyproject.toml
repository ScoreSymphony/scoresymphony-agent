[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "scoresymphony-agent"
version = "0.1.0"
description = "ScoreSymphony Agent Platform and Develop Control UI"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
