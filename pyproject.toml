[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "scoresymphony-agent"
version = "0.1.0"
description = "Standalone ScoreSymphony agent application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
scoresymphony-agent = "scoresymphony_agent.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
